      // Defensive guard against browser extension injection conflicts (e.g. Phantom/MetaMask evmAsk.js "Cannot redefine property: ethereum")
      (function() {

          var _ethereum = window.ethereum;
          var originalDefineProperty = Object.defineProperty;
          Object.defineProperty = function(obj, prop, descriptor) {
            if ((obj === window || obj === globalThis) && prop === 'ethereum') {

                var safeDesc = Object.assign({}, descriptor, { configurable: true });

            return originalDefineProperty.apply(this, arguments);

        window.addEventListener('error', function(event) {

            msg.indexOf('Cannot redefine property: ethereum') !== -1 ||

            file.indexOf('chrome-extension://') !== -1 ||
            file.indexOf('moz-extension://') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {

            }

          }
        }, true);

        window.addEventListener('unhandledrejection', function(event) {
          var reason = event && event.reason;
          var msg = (reason && (reason.message || String(reason))) || '';
          if (
            msg.indexOf('Cannot redefine property: ethereum') !== -1 ||
            msg.indexOf('chrome-extension://') !== -1 ||
            msg.indexOf('moz-extension://') !== -1
          ) {
            event.preventDefault();
            if (typeof event.stopImmediatePropagation === 'function') {
              event.stopImmediatePropagation();
            }
          }
        }, true);
      })();
